    <text class="cell" x="62" y="639">float</text><text class="cell" x="184" y="639">last_longitude</text>
    <text class="cell" x="62" y="669">float</text><text class="cell" x="184" y="669">gps_accuracy_meters</text>
    <text class="cell" x="62" y="699">timestamp</text><text class="cell" x="184" y="699">location_updated_at</text>
    <text class="cell" x="62" y="729">timestamp</text><text class="cell" x="184" y="729">last_seen_at</text>
  </g>

