    <text class="column" x="1114" y="1082">Key</text>
    <text class="cell" x="672" y="1119">string</text><text class="cell" x="794" y="1119">message_hash</text><text class="key" x="1114" y="1119">PK</text>
    <text class="cell" x="672" y="1149">string</text><text class="cell" x="794" y="1149">payload_type</text>
    <text class="cell" x="672" y="1179">text</text><text class="cell" x="794" y="1179">payload_json</text>
