    <line class="rule" x1="650" y1="429" x2="1232" y2="429"/>
    <line class="rule" x1="650" y1="462" x2="1232" y2="462"/>
    <line class="rule" x1="770" y1="429" x2="770" y2="801"/>
    <line class="rule" x1="1097" y1="429" x2="1097" y2="801"/>
