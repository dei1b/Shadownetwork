    <text class="cell" x="1337" y="669">string</text><text class="cell" x="1459" y="669">body</text>
    <text class="cell" x="1337" y="699">timestamp</text><text class="cell" x="1459" y="699">created_at</text>
    <text class="cell" x="1337" y="729">timestamp</text><text class="cell" x="1459" y="729">received_at</text>
    <text class="cell" x="1337" y="759">boolean</text><text class="cell" x="1459" y="759">is_read</text>
  </g>

  <!-- RELAY_PAYLOADS -->
  <g>
    <rect class="entity" x="650" y="1004" width="582" height="358" rx="20"/>
    <text class="title" x="941" y="1041">RELAY_PAYLOADS</text>
    <line class="rule" x1="650" y1="1059" x2="1232" y2="1059"/>
    <line class="rule" x1="650" y1="1092" x2="1232" y2="1092"/>
    <line class="rule" x1="770" y1="1059" x2="770" y2="1362"/>
    <line class="rule" x1="1097" y1="1059" x2="1097" y2="1362"/>
