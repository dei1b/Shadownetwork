    <text class="cell" x="672" y="1239">int</text><text class="cell" x="794" y="1239">ttl_seconds</text>
    <text class="cell" x="672" y="1269">timestamp</text><text class="cell" x="794" y="1269">received_at</text>
    <text class="cell" x="672" y="1299">timestamp</text><text class="cell" x="794" y="1299">expires_at</text>
  </g>

