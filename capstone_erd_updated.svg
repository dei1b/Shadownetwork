    <text class="title" x="1652" y="1041">RELAY_DELIVERIES</text>
    <line class="rule" x1="1365" y1="1059" x2="1940" y2="1059"/>
    <line class="rule" x1="1365" y1="1092" x2="1940" y2="1092"/>
    <line class="rule" x1="1485" y1="1059" x2="1485" y2="1362"/>
    <line class="rule" x1="1805" y1="1059" x2="1805" y2="1362"/>
    <text class="column" x="1387" y="1082">Type</text>
    <text class="column" x="1509" y="1082">Attribute</text>
    <text class="column" x="1822" y="1082">Key</text>
