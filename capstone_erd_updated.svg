<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1640" viewBox="0 0 2300 1640">
  <defs>
    <style>
      .page { fill: #fbfaf8; }
      .entity { fill: #ffffff; stroke: #191919; stroke-width: 3; }
      .rule { stroke: #292929; stroke-width: 1.5; }
      .connector { fill: none; stroke: #171717; stroke-width: 2.5; }
      .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .column { font: 700 16px Arial, Helvetica, sans-serif; fill: #171717; }
      .cell { font: 17px Arial, Helvetica, sans-serif; fill: #191919; }
      .key { font: 700 16px Arial, Helvetica, sans-serif; fill: #191919; }
      .relation { font: 18px Arial, Helvetica, sans-serif; fill: #181818; }
      .figure-title { font: 700 35px Arial, Helvetica, sans-serif; fill: #111111; }
      .figure-subtitle { font: 19px Arial, Helvetica, sans-serif; fill: #444444; }
      .note-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #111111; }
      .note { font: 18px Arial, Helvetica, sans-serif; fill: #222222; }
      .note-strong { font: 700 18px Arial, Helvetica, sans-serif; fill: #111111; }
      .note-box { fill: #ffffff; stroke: #191919; stroke-width: 2; }
    </style>
    <marker id="one-start" viewBox="0 0 18 18" refX="2" refY="9" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 3 2 L 3 16" stroke="#171717" stroke-width="2.2" fill="none"/>
    </marker>
    <marker id="many-end" viewBox="0 0 22 22" refX="20" refY="11" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 11 L 19 11 M 19 11 L 5 2 M 19 11 L 5 20" stroke="#171717" stroke-width="2" fill="none"/>
    </marker>
  </defs>

  <rect class="page" width="2300" height="1640"/>
  <text class="figure-title" x="70" y="52">PROPOSED LOGICAL ERD - SHADOW NETWORK MESSAGING AND RELAY</text>
  <text class="figure-subtitle" x="70" y="82">Direct chat recipients are separate from the peers that temporarily carry or forward a payload.</text>

  <!-- Relationships behind entity boxes -->
  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)" d="M 265 306 L 265 398"/>
  <text class="relation" x="284" y="356">classifies</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)" d="M 875 306 L 875 373"/>
  <text class="relation" x="895" y="346">categorizes</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)" d="M 553 478 L 648 478"/>
  <text class="relation" x="566" y="463">creates SOS</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)" d="M 1555 340 L 1555 403"/>
  <text class="relation" x="1576" y="378">contains</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)"
        d="M 553 623 L 590 623 L 590 905 L 1268 905 L 1268 524 L 1313 524"/>
  <text class="relation" x="610" y="896">sends chat message (sender_peer_id)</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)"
        d="M 553 682 L 570 682 L 570 951 L 1290 951 L 1290 619 L 1313 619"/>
  <text class="relation" x="610" y="944">receives chat message (recipient_peer_id)</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)" d="M 935 801 L 935 1003"/>
  <text class="relation" x="954" y="915">encapsulated as payload</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)"
        d="M 1575 871 L 1575 978 L 1145 978 L 1145 1003"/>
  <text class="relation" x="1205" y="969">encapsulated as payload</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)" d="M 1232 1122 L 1363 1122"/>
  <text class="relation" x="1246" y="1105">tracks transfers</text>

  <path class="connector" marker-start="url(#one-start)" marker-end="url(#many-end)"
        d="M 255 796 L 255 1402 L 1640 1402 L 1640 1362"/>
  <text class="relation" x="570" y="1393">delivery/forwarding attempted with peer (peer_id)</text>

