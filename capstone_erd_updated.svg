    <text class="column" x="794" y="452">Attribute</text>
    <text class="column" x="1114" y="452">Key</text>
    <text class="cell" x="672" y="489">int</text><text class="cell" x="794" y="489">sos_message_id</text><text class="key" x="1114" y="489">PK</text>
    <text class="cell" x="672" y="519">string</text><text class="cell" x="794" y="519">message_hash</text><text class="key" x="1114" y="519">FK, UQ</text>
    <text class="cell" x="672" y="549">string</text><text class="cell" x="794" y="549">sender_peer_id</text><text class="key" x="1114" y="549">FK</text>
    <text class="cell" x="672" y="579">int</text><text class="cell" x="794" y="579">category_id</text><text class="key" x="1114" y="579">FK</text>
    <text class="cell" x="672" y="609">string</text><text class="cell" x="794" y="609">payload_text</text>
    <text class="cell" x="672" y="639">float</text><text class="cell" x="794" y="639">latitude</text>
    <text class="cell" x="672" y="669">float</text><text class="cell" x="794" y="669">longitude</text>
    <text class="cell" x="672" y="699">float</text><text class="cell" x="794" y="699">gps_accuracy_meters</text>
    <text class="cell" x="672" y="729">timestamp</text><text class="cell" x="794" y="729">created_at</text>
  </g>

  <!-- CHAT_MESSAGES -->
  <g>
    <rect class="entity" x="1315" y="404" width="625" height="467" rx="20"/>
    <text class="title" x="1627" y="441">CHAT_MESSAGES</text>
    <line class="rule" x1="1315" y1="459" x2="1940" y2="459"/>
    <line class="rule" x1="1315" y1="492" x2="1940" y2="492"/>
    <line class="rule" x1="1435" y1="459" x2="1435" y2="871"/>
    <line class="rule" x1="1778" y1="459" x2="1778" y2="871"/>
    <text class="column" x="1337" y="482">Type</text>
    <text class="column" x="1459" y="482">Attribute</text>
    <text class="column" x="1795" y="482">Key</text>
    <text class="cell" x="1337" y="519">int</text><text class="cell" x="1459" y="519">chat_message_id</text><text class="key" x="1795" y="519">PK</text>
    <text class="cell" x="1337" y="549">string</text><text class="cell" x="1459" y="549">message_hash</text><text class="key" x="1795" y="549">FK, UQ</text>
    <text class="cell" x="1337" y="579">string</text><text class="cell" x="1459" y="579">conversation_id</text><text class="key" x="1795" y="579">FK</text>
