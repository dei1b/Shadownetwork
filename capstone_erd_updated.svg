    <text class="cell" x="1387" y="1149">string</text><text class="cell" x="1509" y="1149">message_hash</text><text class="key" x="1822" y="1149">FK</text>
    <text class="cell" x="1387" y="1179">string</text><text class="cell" x="1509" y="1179">peer_id</text><text class="key" x="1822" y="1179">FK</text>
    <text class="cell" x="1387" y="1209">string</text><text class="cell" x="1509" y="1209">status</text>
    <text class="cell" x="1387" y="1239">int</text><text class="cell" x="1509" y="1239">attempt_count</text>
    <text class="cell" x="1387" y="1269">timestamp</text><text class="cell" x="1509" y="1269">updated_at</text>
    <text class="cell" x="1387" y="1299">string?</text><text class="cell" x="1509" y="1299">last_error</text>
  </g>

  <!-- Explanation for the panel -->
  <g>
    <rect class="note-box" x="2000" y="100" width="260" height="1262" rx="18"/>
    <text class="note-title" x="2025" y="145">RELATIONSHIP</text>
    <text class="note-title" x="2025" y="173">CLARIFICATION</text>
    <line class="rule" x1="2025" y1="193" x2="2235" y2="193"/>

    <text class="note-strong" x="2025" y="237">Sends</text>
    <text class="note" x="2025" y="268">The peer that</text>
    <text class="note" x="2025" y="294">authored a chat</text>
    <text class="note" x="2025" y="320">message.</text>
    <text class="note" x="2025" y="351">Uses:</text>
    <text class="note-strong" x="2025" y="379">sender_peer_id</text>

    <text class="note-strong" x="2025" y="445">Receives</text>
    <text class="note" x="2025" y="476">The intended final</text>
    <text class="note" x="2025" y="502">recipient of the</text>
    <text class="note" x="2025" y="528">chat message.</text>
    <text class="note" x="2025" y="559">Uses:</text>
    <text class="note-strong" x="2025" y="587">recipient_peer_id</text>

    <text class="note-strong" x="2025" y="653">Relay delivery</text>
    <text class="note" x="2025" y="684">A physical device</text>
    <text class="note" x="2025" y="710">that received or</text>
    <text class="note" x="2025" y="736">forwarded a copy</text>
    <text class="note" x="2025" y="762">during Store-Carry-</text>
    <text class="note" x="2025" y="788">Forward routing.</text>
    <text class="note" x="2025" y="819">Uses:</text>
    <text class="note-strong" x="2025" y="847">peer_id</text>

    <line class="rule" x1="2025" y1="887" x2="2235" y2="887"/>
    <text class="note-strong" x="2025" y="928">Important:</text>
    <text class="note" x="2025" y="960">A relay peer can</text>
    <text class="note" x="2025" y="986">be different from</text>
    <text class="note" x="2025" y="1012">the intended chat</text>
    <text class="note" x="2025" y="1038">recipient.</text>
  </g>

  <text class="figure-subtitle" x="40" y="1586">Notation: PK = Primary Key; FK = Foreign Key; UQ = Unique; string? / int? = nullable field.</text>
  <text class="figure-subtitle" x="40" y="1616">Scope note: SOS messages and private chat messages share the same Store-Carry-Forward relay mechanism.</text>
</svg>
