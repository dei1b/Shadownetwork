    <text class="cell" x="1337" y="301">timestamp</text><text class="cell" x="1459" y="301">updated_at</text>
  </g>

  <!-- PEERS -->
  <g>
    <rect class="entity" x="40" y="404" width="515" height="392" rx="20"/>
    <text class="title" x="297" y="441">PEERS</text>
    <line class="rule" x1="40" y1="459" x2="555" y2="459"/>
    <line class="rule" x1="40" y1="492" x2="555" y2="492"/>
    <line class="rule" x1="160" y1="459" x2="160" y2="796"/>
