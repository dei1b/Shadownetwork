name: Android release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Configure Flutter Java runtime
        shell: bash
        run: |
          flutter config --jdk-dir "${JAVA_HOME}"
          java -version
          javac -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION_NAME}+${BUILD_NUMBER}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Restore permanent release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing permanent signing keystore}"
          umask 077
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/shadownetwork-release.jks"

      - name: Build release APK
        env:
          SHADOW_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shadownetwork-release.jks
          SHADOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SHADOW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SHADOW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --build-name "${{ steps.app_version.outputs.version_name }}"
          --build-number "${{ steps.app_version.outputs.build_number }}"

      - name: Verify permanent signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${EXPECTED_CERT_SHA256:?Missing pinned signing certificate}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          CERT_SHA256="$("${APKSIGNER}" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "${CERT_SHA256}" = "${EXPECTED_CERT_SHA256,,}" || { echo "APK signing certificate does not match the permanent key."; exit 1; }
          echo "Verified permanent release certificate."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/shadownetwork-release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Shadow Network ${RELEASE_TAG}" \
            --notes "Automatic Android APK build from commit ${GITHUB_SHA}."
