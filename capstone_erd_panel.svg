<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220">
  <defs>
    <style>
      .page { fill: #fcfbf9; }
      .box { fill: #fff; stroke: #151515; stroke-width: 2.4; }
      .rule { stroke: #202020; stroke-width: 1.1; }
      .line { fill: none; stroke: #151515; stroke-width: 2.1; }
      .header { font: 700 23px Arial, Helvetica, sans-serif; fill: #121212; text-anchor: middle; }
      .col { font: 700 13.5px Arial, Helvetica, sans-serif; fill: #171717; }
      .txt { font: 14px Arial, Helvetica, sans-serif; fill: #161616; }
      .key { font: 700 14px Arial, Helvetica, sans-serif; fill: #161616; }
      .rel { font: 15px Arial, Helvetica, sans-serif; fill: #131313; }
    </style>
    <marker id="oneStart" viewBox="0 0 22 24" refX="4" refY="12" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 4 2 L 4 22 M 11 2 L 11 22" stroke="#151515" stroke-width="2.2" fill="none"/>
    </marker>
    <marker id="oneEnd" viewBox="0 0 22 24" refX="18" refY="12" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 11 2 L 11 22 M 18 2 L 18 22" stroke="#151515" stroke-width="2.2" fill="none"/>
    </marker>
    <marker id="manyEnd" viewBox="0 0 36 30" refX="34" refY="15" markerWidth="25" markerHeight="20" orient="auto">
      <path d="M 0 15 L 11 15 M 11 3 L 11 27 M 11 15 L 18 15 M 18 15 L 34 2 M 18 15 L 34 15 M 18 15 L 34 28" stroke="#151515" stroke-width="2.3" fill="none"/>
    </marker>
  </defs>

  <rect class="page" width="1900" height="1220"/>

  <!-- Relationships: one-to-many crow's-foot lines are drawn behind entity boxes. -->
  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)" d="M 210 194 L 210 264"/>
  <text class="rel" x="225" y="236">classifies</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)" d="M 694 194 L 694 254"/>
  <text class="rel" x="708" y="229">categorizes</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)" d="M 424 374 L 492 374"/>
  <text class="rel" x="435" y="360">sends</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#oneEnd)" d="M 884 397 L 978 397"/>
  <text class="rel" x="898" y="383">queued as</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)" d="M 1338 411 L 1432 411"/>
  <text class="rel" x="1353" y="396">tracked in</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)" d="M 176 588 L 176 790"/>
  <text class="rel" x="191" y="700">encounters</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)"
        d="M 278 588 L 278 672 L 1042 672 L 1042 851 L 1092 851"/>
  <text class="rel" x="610" y="659">sends</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)"
        d="M 322 588 L 322 712 L 1552 712 L 1552 950 L 1518 950"/>
  <text class="rel" x="805" y="701">receives</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)"
        d="M 245 588 L 245 748 L 542 748 L 542 908 L 562 908"/>
  <text class="rel" x="366" y="737">participates in</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)"
        d="M 738 622 L 738 772 L 668 772 L 668 810"/>
  <text class="rel" x="678" y="761">relates to</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#manyEnd)" d="M 932 902 L 1092 902"/>
  <text class="rel" x="977" y="887">contains</text>

  <path class="line" marker-start="url(#oneStart)" marker-end="url(#oneEnd)"
        d="M 1298 770 L 1298 646 L 1156 646 L 1156 570"/>
