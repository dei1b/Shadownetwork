      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #111111; letter-spacing: 0.5px; }
      .box-title { font: 700 31px Arial, Helvetica, sans-serif; fill: #111111; letter-spacing: 1px; text-anchor: middle; }
      .column-head { font: 700 20px Arial, Helvetica, sans-serif; fill: #111111; }
      .type { font: 21px Arial, Helvetica, sans-serif; fill: #111111; }
      .attribute { font: 21px Arial, Helvetica, sans-serif; fill: #111111; }
      .key { font: 700 20px Arial, Helvetica, sans-serif; fill: #111111; }
      .uq-note { font: 700 16px Arial, Helvetica, sans-serif; fill: #111111; }
      .connector { fill: none; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #111111; stroke-width: 3; }
      .rel { font: 600 20px Arial, Helvetica, sans-serif; fill: #111111; }
