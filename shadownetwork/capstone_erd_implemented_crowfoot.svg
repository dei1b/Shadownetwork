<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1810" viewBox="0 90 2700 1810">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .entity { fill: #ffffff; stroke: #111111; stroke-width: 3; }
      .entity-head, .lookup-head, .relay-head, .chat-head { fill: #ffffff; stroke: #111111; stroke-width: 2; }
