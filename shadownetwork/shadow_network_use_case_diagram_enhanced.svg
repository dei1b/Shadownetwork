<rect x="2385" y="768" width="150" height="35" fill="white"/>
<text x="2460.0" y="785.5" text-anchor="middle" dominant-baseline="middle" class="inc" fill="rgb(0,0,0)">&lt;&lt;include&gt;&gt;</text>

