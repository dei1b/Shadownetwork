<rect x="2375" y="1215" width="150" height="35" fill="white"/>
<text x="2450.0" y="1232.5" text-anchor="middle" dominant-baseline="middle" class="inc" fill="rgb(0,0,0)">&lt;&lt;include&gt;&gt;</text>

<!-- 10. Execute SCF Relay -> Discover Peers (BLE) -->
<polyline points="2940,1005.0 2940,497.5" fill="none" stroke="rgb(0,0,0)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="18 15"/>
<rect x="2865" y="733.75" width="150" height="35" fill="white"/>
<text x="2940.0" y="751.25" text-anchor="middle" dominant-baseline="middle" class="inc" fill="rgb(0,0,0)">&lt;&lt;include&gt;&gt;</text>

<!-- 11. Execute SCF Relay -> Transfer Relay (Wi-Fi) -->
