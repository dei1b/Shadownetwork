<text x="2100.0" y="1900" text-anchor="middle" dominant-baseline="middle" class="note" fill="rgb(45,45,45)">SQLite is shown as an internal use case, not an external actor. The relay engine covers deduplication, TTL/hop count, queueing, and peer delivery tracking.</text>
