<polyline points="285,405 690.0,1640" fill="none" stroke="rgb(45,45,45)" stroke-width="4" stroke-linejoin="round"/>

<!-- Responder / Rescuer connections (converged on right hand: 285, 1385) -->
<polyline points="285,1385 740.0,725" fill="none" stroke="rgb(45,45,45)" stroke-width="4" stroke-linejoin="round"/>
<polyline points="285,1385 695.0,1030" fill="none" stroke="rgb(45,45,45)" stroke-width="4" stroke-linejoin="round"/>
