<rect x="2865" y="1261.25" width="150" height="35" fill="white"/>
<text x="2940.0" y="1278.75" text-anchor="middle" dominant-baseline="middle" class="inc" fill="rgb(0,0,0)">&lt;&lt;include&gt;&gt;</text>

