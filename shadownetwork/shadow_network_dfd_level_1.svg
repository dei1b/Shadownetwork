<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1100" viewBox="0 0 2200 1100">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .title { font-family: 'Arial', sans-serif; font-weight: 700; font-size: 38px; fill: #2c3e50; }
    .label { font-family: 'Arial', sans-serif; font-weight: 700; font-size: 26px; fill: #2c3e50; }
    .process-num { font-family: 'Arial', sans-serif; font-weight: 700; font-size: 26px; fill: #7f8c8d; }
    .process-title { font-family: 'Arial', sans-serif; font-weight: 700; font-size: 22px; fill: #2c3e50; }
    .flow-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #2c3e50; font-weight: bold; }
    .sub-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #7f8c8d; font-weight: bold; }
  </style>
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 10 L 5 0 L 9 10 z" fill="#2c3e50"/>
    </marker>
    
    <!-- Subtle drop shadows for nodes -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="1100" y="80" text-anchor="middle" class="title">DFD Level 1: Shadow Network Sub-System Flow Diagram</text>

  <!-- ================= PROCESS 1: MANAGE CHAT & SOS MESSAGING (Center-Left) ================= -->
  <g filter="url(#shadow)">
    <rect x="540" y="260" width="320" height="180" rx="8" ry="8" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
    <line x1="540" y1="320" x2="860" y2="320" stroke="#2c3e50" stroke-width="3"/>
    <text x="700" y="295" text-anchor="middle" class="process-num">1</text>
    <text x="700" y="365" text-anchor="middle" class="process-title">Manage Chat &amp;</text>
    <text x="700" y="405" text-anchor="middle" class="process-title">SOS Messaging</text>
  </g>

  <!-- ================= PROCESS 2: STORE-CARRY-FORWARD RELAY SERVICE (Center-Right) ================= -->
  <g filter="url(#shadow)">
    <rect x="1340" y="260" width="320" height="180" rx="8" ry="8" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
    <line x1="1340" y1="320" x2="1660" y2="320" stroke="#2c3e50" stroke-width="3"/>
    <text x="1500" y="295" text-anchor="middle" class="process-num">2</text>
    <text x="1500" y="365" text-anchor="middle" class="process-title">Store-Carry-Forward</text>
    <text x="1500" y="405" text-anchor="middle" class="process-title">Relay Service</text>
  </g>

  <!-- ================= PROCESS 3: RENDER MAP & DIAGNOSTICS (Bottom-Center) ================= -->
  <g filter="url(#shadow)">
    <rect x="940" y="760" width="320" height="180" rx="8" ry="8" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
    <line x1="940" y1="820" x2="1260" y2="820" stroke="#2c3e50" stroke-width="3"/>
    <text x="1100" y="795" text-anchor="middle" class="process-num">3</text>
    <text x="1100" y="865" text-anchor="middle" class="process-title">Process Map &amp;</text>
    <text x="1100" y="905" text-anchor="middle" class="process-title">Connection Diagnostics</text>
  </g>

  <!-- ================= DATA STORE D1: SQLITE LOCAL STORAGE (Center) ================= -->
  <g filter="url(#shadow)">
    <rect x="977" y="482" width="246" height="136" fill="#ffffff" opacity="0.95" rx="4" ry="4"/>
    <!-- Gane-Sarson open-ended shape -->
    <path d="M 1225 480 L 975 480 L 975 620 L 1225 620 M 1035 480 L 1035 620" fill="none" stroke="#2c3e50" stroke-width="3"/>
    <text x="1005" y="555" text-anchor="middle" class="label">D1</text>
    <text x="1130" y="535" text-anchor="middle" class="process-title">SQLite Local</text>
    <text x="1130" y="575" text-anchor="middle" class="process-title">Storage</text>
  </g>

  <!-- ================= EXTERNAL ENTITY: USER (Left) ================= -->
  <g filter="url(#shadow)">
    <rect x="50" y="260" width="250" height="180" rx="8" ry="8" fill="#ffffff" stroke="#34495e" stroke-width="3"/>
    <text x="175" y="345" text-anchor="middle" class="label">User</text>
    <text x="175" y="380" text-anchor="middle" class="sub-text">(Resident)</text>
  </g>

  <!-- ================= EXTERNAL ENTITY: PEER NODE (Right) ================= -->
  <g filter="url(#shadow)">
    <rect x="1900" y="260" width="250" height="180" rx="8" ry="8" fill="#ffffff" stroke="#34495e" stroke-width="3"/>
    <text x="2025" y="345" text-anchor="middle" class="label">Peer Node</text>
    <text x="2025" y="380" text-anchor="middle" class="sub-text">(Nearby Device)</text>
  </g>

  <!-- ================= EXTERNAL ENTITY: RESCUER (Bottom-Left) ================= -->
  <g filter="url(#shadow)">
    <rect x="540" y="760" width="250" height="180" rx="8" ry="8" fill="#ffffff" stroke="#34495e" stroke-width="3"/>
    <text x="665" y="845" text-anchor="middle" class="label">Rescuer</text>
    <text x="665" y="880" text-anchor="middle" class="sub-text">(Responder)</text>
  </g>


  <!-- ================= DATA FLOW LINES & LABELS ================= -->

  <!-- 1. User -> Process 1 (SOS & Chats) -->
  <path d="M 300 315 L 530 315" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-right)"/>
  <rect x="330" y="275" width="180" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="420" y="295" text-anchor="middle" class="flow-text">SOS Payload &amp; Chats</text>

  <!-- 2. Process 1 -> User (Incoming Alerts) -->
  <path d="M 540 385 L 310 385" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-left)"/>
  <rect x="330" y="395" width="180" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="420" y="415" text-anchor="middle" class="flow-text">Incoming Chats &amp; Alerts</text>

  <!-- 3. Process 1 -> Rescuer (SOS Feeds & Maps) -->
  <path d="M 625 440 L 625 750" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-down)"/>
  <g transform="translate(610, 595) rotate(-90)">
    <rect x="-110" y="-15" width="220" height="30" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" class="flow-text">SOS Map Markers &amp; Chat Feed</text>
  </g>

  <!-- 4. Rescuer -> Process 1 (Rescue Status & Chats) -->
  <path d="M 735 760 L 735 450" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-up)"/>
  <g transform="translate(750, 595) rotate(90)">
    <rect x="-110" y="-15" width="220" height="30" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" class="flow-text">Rescue Chats &amp; Status Updates</text>
  </g>

  <!-- 5. Process 2 -> Peer Node (Outgoing Relay) -->
  <path d="M 1660 315 L 1890 315" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-right)"/>
  <rect x="1690" y="275" width="180" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="1780" y="295" text-anchor="middle" class="flow-text">Outgoing Relay Payloads</text>

  <!-- 6. Peer Node -> Process 2 (Incoming Relay) -->
  <path d="M 1900 385 L 1670 385" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-left)"/>
  <rect x="1690" y="395" width="180" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="1780" y="415" text-anchor="middle" class="flow-text">Incoming Relay Payloads</text>

  <!-- 7. Process 1 -> D1 SQLite (Write) -->
  <path d="M 830 440 L 980 500" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-right)"/>
  <g transform="translate(900, 450) rotate(22)">
    <rect x="-85" y="-13" width="170" height="26" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" class="flow-text">New SOS &amp; Chats</text>
  </g>

  <!-- 8. D1 SQLite -> Process 1 (Read history) -->
  <path d="M 985 530 L 835 470" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-left)"/>
  <g transform="translate(915, 520) rotate(22)">
    <rect x="-85" y="-13" width="170" height="26" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" class="flow-text">Feeds &amp; History</text>
  </g>

  <!-- 9. D1 SQLite -> Process 2 (Read queue) -->
  <path d="M 1215 500 L 1370 440" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-right)"/>
  <g transform="translate(1290, 450) rotate(-21)">
    <rect x="-90" y="-13" width="180" height="26" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" class="flow-text">Pending Relays</text>
  </g>

  <!-- 10. Process 2 -> D1 SQLite (Update Status) -->
  <path d="M 1365 470 L 1210 530" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-left)"/>
  <g transform="translate(1285, 520) rotate(-21)">
    <rect x="-90" y="-13" width="180" height="26" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" class="flow-text">Relay Delivery Status</text>
  </g>

  <!-- 11. D1 SQLite -> Process 3 (GPS & connection stats) -->
  <path d="M 1100 620 L 1100 750" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-down)"/>
  <rect x="1115" y="665" width="220" height="40" fill="#ffffff" opacity="0.9"/>
  <text x="1125" y="680" text-anchor="start" class="flow-text">GPS Coordinates &amp;</text>
  <text x="1125" y="700" text-anchor="start" class="flow-text">Connection Stats</text>

  <!-- 12. Process 3 -> Rescuer (Coordinates) -->
  <path d="M 940 850 L 800 850" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow-left)"/>
  <rect x="815" y="810" width="110" height="30" fill="#ffffff" opacity="0.9"/>
  <text x="870" y="830" text-anchor="middle" class="flow-text">Map Markers</text>
</svg>